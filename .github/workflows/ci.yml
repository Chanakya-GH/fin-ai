name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff
      
      - name: Lint with Ruff
        run: |
          ruff check src/ tests/ eval/ --ignore E501
      
      - name: Run unit tests (guardrails + schemas only, no GPU)
        env:
          DEMO_MODE: "true"
        run: |
          pytest tests/test_pipeline.py -v --tb=short
      
      - name: Run API tests (demo mode)
        env:
          DEMO_MODE: "true"
        run: |
          pytest tests/test_api.py -v --tb=short
